{% extends "base.html" %}
{% block title %}Create Account{% endblock %}

{% block guest_content %}
<div class="w-full max-w-xl rounded-[28px] border border-af-border bg-white/90 p-8 shadow-af-card backdrop-blur-xl">
    <div class="mb-7 text-center">
        <a href="{{ url_for('index') }}" class="inline-flex items-center justify-center gap-3 font-display text-3xl font-extrabold text-af-text no-underline">
            <span class="grid h-11 w-11 place-items-center rounded-xl bg-gradient-to-br from-af-accent to-af-accent-2 text-base text-white">
                <i class="bi bi-cpu"></i>
            </span>
            AFIMAS
        </a>
        <p class="mt-3 text-sm text-af-muted">Create your account to start registering faces and tracking mood scans.</p>
    </div>

    <form method="POST" action="{{ url_for('auth.signup') }}" novalidate class="space-y-4">
        <div class="grid gap-4 sm:grid-cols-2">
            <div>
                <label for="name" class="af-label">Full Name</label>
                <div class="relative">
                    <i class="bi bi-person absolute left-4 top-1/2 -translate-y-1/2 text-af-muted"></i>
                    <input id="name" name="name" type="text" value="{{ name or '' }}" placeholder="Your name" class="af-input pl-11" required>
                </div>
            </div>

            <div>
                <label for="age" class="af-label">Age</label>
                <div class="relative">
                    <i class="bi bi-calendar absolute left-4 top-1/2 -translate-y-1/2 text-af-muted"></i>
                    <input id="age" name="age" type="number" value="{{ age or '' }}" placeholder="18" min="1" max="120" class="af-input pl-11" required>
                </div>
            </div>
        </div>

        <div>
            <label for="email" class="af-label">Email</label>
            <div class="relative">
                <i class="bi bi-envelope absolute left-4 top-1/2 -translate-y-1/2 text-af-muted"></i>
                <input id="email" name="email" type="email" value="{{ email or '' }}" placeholder="you@example.com" class="af-input pl-11" required>
            </div>
        </div>

        <div>
            <label for="password" class="af-label">Password</label>
            <div class="relative">
                <i class="bi bi-lock absolute left-4 top-1/2 -translate-y-1/2 text-af-muted"></i>
                <input id="password" name="password" type="password" placeholder="At least 6 characters" class="af-input pl-11" required>
            </div>
        </div>

        <button type="submit" class="btn-af-primary w-full">
            <i class="bi bi-person-plus"></i> Create Account
        </button>
    </form>

    <p class="mt-6 text-center text-sm text-af-muted">
        Already have an account?
        <a href="{{ url_for('auth.login') }}" class="font-semibold text-af-accent no-underline">Sign in</a>
    </p>
</div>
{% endblock %}
